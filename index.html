<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Open Google Calendar</title>

    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        margin: 24px;
        line-height: 1.4;
      }
      .small { opacity: 0.75; font-size: 0.95em; }
      button, a {
        font: inherit;
      }
      button {
        padding: 10px 14px;
        cursor: pointer;
      }
    </style>

    <script>
      (function () {
        const GCAL_URI = "https://calendar.google.com/calendar/u/0/r";

        function tryLaunchGcal() {
          // Attempt 1: direct navigation
          window.location.href = GCAL_URI;

          // Attempt 2: retry shortly after (some browsers ignore first attempt)
          setTimeout(() => {
            window.location.href = GCAL_URI;
          }, 250);

          // Attempt 3: "hidden iframe" trick (sometimes helps with protocol handlers)
          setTimeout(() => {
            const iframe = document.createElement("iframe");
            iframe.style.display = "none";
            iframe.src = GCAL_URI;
            document.body.appendChild(iframe);
            setTimeout(() => iframe.remove(), 2000);
          }, 600);
        }

        function tryAutoClose() {
          // Firefox usually blocks closing a tab that wasn't opened by script.
          // But this is a harmless "best effort" attempt.
          setTimeout(() => {
            try {
              window.open("", "_self");
              window.close();
            } catch (e) {
              // ignore
            }
          }, 1200);
        }

            window.close();
          });

          link.href = GCAL_URI;
        });
      })();
    </script>
  </head>

  <body>
    <h1>Opening Google Calendar…</h1>
    <p class="small">
      If Google Calendar didn’t open, use the button below. If it did open, you can close this tab.
    </p>

    <p>
      <button id="open" type="button">Open Google Calendar</button>
      <button id="close" type="button">Close tab</button>
    </p>

    <p class="small">
      Direct link (fallback): <a id="link" href="#">https://calendar.google.com/calendar/u/0/r</a>
    </p>
  </body>
</html>
